name: Publish P&G and Finance reader prototypes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: financial-scenarios-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'hoichengit/Portfolio-Guide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify package and unchanged financial analysis
        env:
          EXPECTED_ZIP_SHA: 091236576dcee2f60b4208413e67dd93a8a90418a13f67840c5764a1bb024c61
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          archive=pathlib.Path('reader-update.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['EXPECTED_ZIP_SHA']
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'reader-update'
          dest.mkdir()
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for m in z.infolist():
                  p=pathlib.PurePosixPath(m.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ('project','main','manifest.json')
                  assert (m.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall(dest)
          manifest=json.loads((dest/'manifest.json').read_text())
          assert manifest['base_project']=='cc912b51157acc98fd5d136a334f1fe140c6497c'
          assert manifest['base_main']=='5c9839680b91e9f6e842e604645fd8af3f7daad5'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          old={}
          for line in git('ls-tree','-r',manifest['base_project']).splitlines():
              header,path=line.split('\t',1);old[path]=header.split()[2]
          current={}
          for f in (dest/'project').rglob('*'):
              if f.is_file():
                  b=f.read_bytes();current[str(f.relative_to(dest/'project'))]=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert current==manifest['expected_blobs']
          changed=sorted(k for k in old.keys()|current.keys() if old.get(k)!=current.get(k))
          assert changed==manifest['allowed_changes']
          assert current['docs/public_cases/PG_legacy.md']==old['docs/public_cases/PG.md']
          for path in changed:
              assert path in {f'outputs/guide_evidence/{x}' for x in ('Finance_Evidence.xlsx','revenue.png','timing.png','margin.png','scenarios.png','manifest.json')} or path in ('src/package_public.py','docs/public_cases/PG.md','docs/public_cases/PG_legacy.md','docs/public_cases/PG/01_agents.md','docs/public_agents/finance.md','docs/public_agents/finance-skills.md'), path
          main_expected={'agents/README.md','agents/finance.md','agents/finance-skills.md'}
          assert set(manifest['main_blobs'])==main_expected
          assert {str(f.relative_to(dest/'main')) for f in (dest/'main').rglob('*') if f.is_file()}==main_expected
          for path,h in manifest['main_blobs'].items():
              b=(dest/'main'/path).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h
          freezes=list((dest/'project/outputs/runs').glob('*/freeze.json'));assert len(freezes)==8
          for f in freezes:
              for path,h in json.loads(f.read_text())['files'].items():assert hashlib.sha256((f.parent/path).read_bytes()).hexdigest()==h
          print('Financial data, forecasts, model runs and Excel unchanged; eight freeze checks pass')
          PY
      - name: Fast-forward dashboard branch and remove package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main codex/financial-scenarios
          BASE=$(git rev-parse origin/main)
          PROJECT_BASE=$(git rev-parse origin/codex/financial-scenarios)
          test "$PROJECT_BASE" = cc912b51157acc98fd5d136a334f1fe140c6497c
          git diff --name-only 5c9839680b91e9f6e842e604645fd8af3f7daad5 "$BASE" > "$RUNNER_TEMP/main-changes"
          python3 - <<'PY'
          import os,pathlib
          changed=set((pathlib.Path(os.environ['RUNNER_TEMP'])/'main-changes').read_text().splitlines())
          assert changed <= {'reader-update.zip','.github/workflows/reader-update.yml'}, changed
          PY
          git ls-remote --heads origin refs/heads/codex/commercial-finance refs/heads/codex/global-electronics refs/heads/codex/it-spend refs/heads/codex/pets-more > "$RUNNER_TEMP/old-before"
          export GIT_INDEX_FILE="$RUNNER_TEMP/dashboard.index"
          git read-tree --empty
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$RUNNER_TEMP/reader-update/project" -C "$RUNNER_TEMP/reader-update/project" add -f --all
          TREE=$(git write-tree)
          PROJECT_COMMIT=$(printf '%s\n' 'Add P&G part-one and Finance reader prototypes' | git commit-tree "$TREE" -p "$PROJECT_BASE")
          unset GIT_INDEX_FILE
          git checkout --detach "$BASE"
          cp "$RUNNER_TEMP/reader-update/main/agents/"*.md agents/
          git add agents/README.md agents/finance.md agents/finance-skills.md
          git rm reader-update.zip
          MAIN_COMMIT=$(printf '%s\n' 'Publish Finance reader guide and remove temporary package' | git commit-tree "$(git write-tree)" -p "$BASE")
          git push --atomic origin "$PROJECT_COMMIT:refs/heads/codex/financial-scenarios" "$MAIN_COMMIT:refs/heads/main"
          git ls-remote --heads origin refs/heads/codex/commercial-finance refs/heads/codex/global-electronics refs/heads/codex/it-spend refs/heads/codex/pets-more > "$RUNNER_TEMP/old-after"
          cmp "$RUNNER_TEMP/old-before" "$RUNNER_TEMP/old-after"
          echo "Project: $PROJECT_COMMIT; main: $MAIN_COMMIT"
          echo 'Temporary workflow retained for owner UI deletion.'
