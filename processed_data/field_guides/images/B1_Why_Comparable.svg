<text x="32" y="444" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#233F32" text-anchor="start">2. Match the category and currency</text>
<text x="32" y="478" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#233F32" text-anchor="start">Both datasets use the same 9 categories and US dollars (USD).</text>
<rect x="32" y="503" width="1056" height="48" rx="10" fill="#EAF1E9" stroke="none"/>
<text x="560" y="534" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#AC1E28" text-anchor="middle">Example: January 2022  =  January 2022   •   Sales  =  Sales   •   USD  =  USD</text>
<text x="32" y="592" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#233F32" text-anchor="start">3. Add up actual transactions, then compare with the monthly budget</text>
