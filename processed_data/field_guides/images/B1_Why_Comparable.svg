<text x="50" y="739" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#233F32" text-anchor="start">Sum of actual Sales transactions</text>
<rect x="387" y="616" width="315" height="145" rx="10" fill="#FFFFFF" stroke="#D6DFD5"/>
