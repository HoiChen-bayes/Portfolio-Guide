<text x="405" y="739" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#233F32" text-anchor="start">Monthly Sales budget</text>
<rect x="742" y="616" width="346" height="145" rx="10" fill="#FFFFFF" stroke="#D6DFD5"/>
