<text x="760" y="701" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#C52E35" text-anchor="start">−$1,000</text>
<text x="760" y="739" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#233F32" text-anchor="start">January Sales is below budget</text>
