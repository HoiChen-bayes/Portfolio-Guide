<line x1="710" y1="687" x2="734" y2="687" stroke="#C52E35" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="807" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#233F32" text-anchor="start">WHY IT WORKS: the two amounts describe the same month, category and currency.</text>
